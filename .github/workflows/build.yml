name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix build .#icpc-presentation .#icpc-presentation-admin .#icpc-resolver
      - name: Smoke test
        run: |
          test -x result/bin/presentation-client
          for wrapper in result*/bin/*; do
            class=$(grep -o 'org\.icpc\.tools\.[A-Za-z.]*' "$wrapper" | tail -n1)
            echo "$wrapper -> $class"
            for jar in "$(dirname "$wrapper")"/../share/icpc/lib/*.jar; do
              unzip -l "$jar"
            done | grep -q " ${class//.//}\.class$"
          done
