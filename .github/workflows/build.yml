name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix build .#default
      - name: Smoke test
        run: |
          test -x result/bin/presentation-client
          grep -q ClientLauncher result/bin/presentation-client
          for jar in result/share/icpc/lib/*.jar; do
            unzip -l "$jar" | grep -q 'ClientLauncher\.class' && exit 0
          done
          exit 1
